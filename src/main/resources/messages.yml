# --------------------------------------------------------------
#  Culture
# --------------------------------------------------------------

culture:
  pot-pose: "<color:#4ade80>Pot posé.</color> <color:#9ca3af>Il attend sa graine.</color>"
  graine-plantee: "<color:#4ade80>Graine de <drogue> plantée.</color> <color:#9ca3af>Arrose-la bien.</color>"
  deja-plante: "<color:#f87171>Ce pot est déjà occupé.</color>"
