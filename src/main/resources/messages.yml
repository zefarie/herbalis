#  Sechage et conditionnement
# --------------------------------------------------------------

sechage:
  rack-pose: "<color:#4ade80>Rack de séchage installé.</color>"
  tete-deposee: "<color:#4ade80>Tête suspendue</color> <color:#9ca3af>(<nombre>/<capacite>). Le temps travaille pour toi.</color>"
