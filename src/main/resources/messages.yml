  jarre-moisie-info: "<color:#f87171>Cette jarre a moisi. Vide-la d'abord.</color>"
  recupere: "<color:#4ade80><font:herbalis:icons></font> Affinage parfait : la qualité s'est bonifiée.</color>"
  recupere-trop-tot: "<color:#fbbf24>Sortie trop tôt : la weed n'a pas eu le temps de se bonifier.</color>"
  recupere-moisi: "<color:#f87171><font:herbalis:icons></font> L'odeur te prend à la gorge... tout est moisi.</color>"
  contenu-rendu: "<color:#fbbf24>Tu ressors la weed de la jarre, affinage interrompu.</color>"
  jarre-cassee: "<color:#fbbf24>Jarre récupérée.</color>"

