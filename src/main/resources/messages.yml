  melange-interdit: "<color:#f87171>On ne mélange pas les récoltes sur un même rack.</color>"
  recupere: "<color:#4ade80><font:herbalis:icons></font> Weed séchée récupérée, elle croustille juste ce qu'il faut.</color>"
  recupere-trop-tot: "<color:#fbbf24>Récupérée trop tôt... l'humidité a coûté de la qualité.</color>"
  contenu-rendu: "<color:#fbbf24>Tu décroches les têtes, encore humides.</color>"
  rack-casse: "<color:#fbbf24>Rack démonté.</color>"

conditionnement:
  rien-a-emballer: "<color:#f87171>Aucune weed séchée dans l'inventaire.</color>"
  pochon-rempli: "<color:#4ade80>Pochon rempli.</color> <etoiles>"

nuisibles:
  traitee: "<color:#4ade80><font:herbalis:icons></font> Nuage de traitement... les nuisibles se dispersent.</color>"
  plante-saine: "<color:#9ca3af>Aucun nuisible sur cette plante.</color>"
  pulverisateur-vide: "<color:#fbbf24>Pulvérisateur vide : rechargez-le sur un bloc d'eau.</color>"

curing:
  jarre-posee: "<color:#4ade80>Jarre de curing posée.</color> <color:#9ca3af>L'affinage attend sa matière.</color>"
  tete-deposee: "<color:#4ade80>Weed mise en jarre</color> <color:#9ca3af>(<nombre>/<capacite>). L'ombre fait son oeuvre.</color>"
