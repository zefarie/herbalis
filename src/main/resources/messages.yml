# ==============================================================
#  Herbalis : tous les textes joueur, en MiniMessage.
#
#  Charte : vert #86efac -> #22c55e (primaire), ambre #fbbf24
#  (qualite), rouge doux #f87171 (erreurs), gris #9ca3af
#  (ambiance), separateurs #3f3f46.
#
#  <prefix> insere le prefixe defini ci-dessous.
# ==============================================================

# La font herbalis:icons fournit les glyphes dessines du pack :
#  feuille,  goutte, / etoiles, /
# segments,  soleil,  ciseaux,  sablier,  coche,
#  alerte,  fumee. Ils se teintent avec les balises <color>.

general:
  prefix: "<color:#4ade80><font:herbalis:icons></font></color> <gradient:#86efac:#22c55e><b>Herbalis</b></gradient> <color:#3f3f46>│</color>"

# --------------------------------------------------------------
#  Items : noms et lores
#  Placeholders : <drogue> (nom de la drogue), <etoiles> (qualite)
# --------------------------------------------------------------

items:
  pot:
    nom: "<gradient:#e8b64c:#b45309>Pot de culture</gradient>"
    lore:
      - "<!i><color:#3f3f46>· · · · · · · · · · · · · · · ·</color>"
      - "<!i><color:#9ca3af>Terre cuite, terreau riche,</color>"
      - "<!i><color:#9ca3af>et beaucoup d'ambition.</color>"
      - "<!i><i><color:#71717a>Tout commence ici.</color></i>"
      - "<!i><color:#3f3f46>· · · · · · · · · · · · · · · ·</color>"
  drying_rack:
    nom: "<gradient:#e8b64c:#92400e>Rack de séchage</gradient>"
    lore:
      - "<!i><color:#3f3f46>· · · · · · · · · · · · · · · ·</color>"
      - "<!i><color:#9ca3af>Des ficelles, du bois brut.</color>"
      - "<!i><color:#9ca3af>Le temps fait le reste.</color>"
      - "<!i><i><color:#71717a>La patience a une odeur.</color></i>"
      - "<!i><color:#3f3f46>· · · · · · · · · · · · · · · ·</color>"
  curing_jar:
    nom: "<gradient:#d9c58f:#a1863f>Jarre de curing</gradient>"
    lore:
      - "<!i><color:#3f3f46>· · · · · · · · · · · · · · · ·</color>"
      - "<!i><color:#9ca3af>Le verre, l'ombre et le temps</color>"
      - "<!i><color:#9ca3af>affinent la weed séchée.</color>"
      - "<!i><color:#f87171>Ne l'oublie pas trop longtemps...</color>"
      - "<!i><i><color:#71717a>Le secret des connaisseurs.</color></i>"
      - "<!i><color:#3f3f46>· · · · · · · · · · · · · · · ·</color>"
  watering_can:
    nom: "<gradient:#7dd3fc:#0ea5e9>Arrosoir</gradient>"
    lore:
      - "<!i><color:#3f3f46>· · · · · · · · · · · · · · · ·</color>"
      - "<!i><color:#9ca3af>Se recharge sur un bloc d'eau.</color>"
      - "<!i><i><color:#71717a>La vie coule a petites gouttes.</color></i>"
      - "<!i><color:#3f3f46>· · · · · · · · · · · · · · · ·</color>"
  sprayer:
    nom: "<gradient:#a7f3d0:#10b981>Pulvérisateur</gradient>"
    lore:
      - "<!i><color:#3f3f46>· · · · · · · · · · · · · · · ·</color>"
      - "<!i><color:#9ca3af>Chasse les nuisibles d'un nuage</color>"
      - "<!i><color:#9ca3af>fin. Se recharge sur l'eau.</color>"
      - "<!i><i><color:#71717a>Pschitt, et la paix revient.</color></i>"
      - "<!i><color:#3f3f46>· · · · · · · · · · · · · · · ·</color>"
  dripper:
    nom: "<gradient:#93c5fd:#3b82f6>Goutte-à-goutte</gradient>"
    lore:
      - "<!i><color:#3f3f46>· · · · · · · · · · · · · · · ·</color>"
      - "<!i><color:#9ca3af>S'installe sur un pot : l'eau</color>"
      - "<!i><color:#9ca3af>tient deux fois plus longtemps.</color>"
      - "<!i><i><color:#71717a>Pour les jardiniers qui voyagent.</color></i>"
      - "<!i><color:#3f3f46>· · · · · · · · · · · · · · · ·</color>"
  fertilizer:
    nom: "<gradient:#a3e635:#65a30d>Engrais naturel</gradient>"
    lore:
      - "<!i><color:#3f3f46>· · · · · · · · · · · · · · · ·</color>"
      - "<!i><color:#9ca3af>Un sachet qui sent la foret</color>"
      - "<!i><color:#9ca3af>apres la pluie. Un par stage.</color>"
      - "<!i><i><color:#71717a>Les plantes disent merci.</color></i>"
      - "<!i><color:#3f3f46>· · · · · · · · · · · · · · · ·</color>"
  rolling_paper:
    nom: "<color:#e5e7eb>Feuille à rouler</color>"
    lore:
      - "<!i><color:#3f3f46>· · · · · · · · · · · · · · · ·</color>"
      - "<!i><color:#9ca3af>Fine, blanche, impatiente.</color>"
      - "<!i><i><color:#71717a>Il ne manque plus que le contenu.</color></i>"
      - "<!i><color:#3f3f46>· · · · · · · · · · · · · · · ·</color>"
  pouch_empty:
    nom: "<gradient:#d6b88a:#b8946a>Pochon vide</gradient>"
    lore:
      - "<!i><color:#3f3f46>· · · · · · · · · · · · · · · ·</color>"
      - "<!i><color:#9ca3af>Petit sac de papier kraft.</color>"
      - "<!i><color:#9ca3af>Clic droit avec de la weed séchée</color>"
      - "<!i><color:#9ca3af>dans l'inventaire pour le remplir.</color>"
      - "<!i><color:#3f3f46>· · · · · · · · · · · · · · · ·</color>"
  seed:
    nom: "<gradient:#86efac:#22c55e>Graine de <drogue></gradient>"
    lore:
      - "<!i><color:#3f3f46>· · · · · · · · · · · · · · · ·</color>"
      - "<!i>Lignée <etoiles>"
      - "<!i><color:#9ca3af>Clic droit sur un pot de culture</color>"
      - "<!i><color:#9ca3af>pour la planter.</color>"
      - "<!i><i><color:#71717a>Une promesse en miniature.</color></i>"
      - "<!i><color:#3f3f46>· · · · · · · · · · · · · · · ·</color>"
  bud_fresh:
    nom: "<gradient:#86efac:#22c55e>Tête fraîche de <drogue></gradient>"
    lore:
      - "<!i><color:#3f3f46>· · · · · · · · · · · · · · · ·</color>"
      - "<!i>Qualité <etoiles>"
      - "<!i><color:#9ca3af>Encore humide. A suspendre sur</color>"
      - "<!i><color:#9ca3af>un rack de séchage.</color>"
      - "<!i><i><color:#71717a>Ça sent la victoire... et la sève.</color></i>"
      - "<!i><color:#3f3f46>· · · · · · · · · · · · · · · ·</color>"
  dried:
    nom: "<gradient:#b5cc6a:#6b8e23><drogue> séchée</gradient>"
    lore:
      - "<!i><color:#3f3f46>· · · · · · · · · · · · · · · ·</color>"
      - "<!i>Qualité <etoiles>"
      - "<!i><color:#9ca3af>Sèche et parfumée, prête à être</color>"
      - "<!i><color:#9ca3af>conditionnée en pochon.</color>"
      - "<!i><color:#3f3f46>· · · · · · · · · · · · · · · ·</color>"
  pouch:
    nom: "<gradient:#d6b88a:#b8946a>Pochon de <drogue></gradient>"
    lore:
      - "<!i><color:#3f3f46>· · · · · · · · · · · · · · · ·</color>"
      - "<!i>Qualité <etoiles>"
      - "<!i><color:#9ca3af>Avec une feuille à rouler,</color>"
      - "<!i><color:#9ca3af>devient un joint (établi).</color>"
      - "<!i><i><color:#71717a>Discret, enfin presque.</color></i>"
      - "<!i><color:#3f3f46>· · · · · · · · · · · · · · · ·</color>"
  joint:
    nom: "<gradient:#f5f5f4:#a8a29e>Joint</gradient> <gradient:#86efac:#22c55e>de <drogue></gradient>"
    lore:
      - "<!i><color:#3f3f46>· · · · · · · · · · · · · · · ·</color>"
      - "<!i>Qualité <etoiles>"
      - "<!i><color:#9ca3af>Taffes restantes : <taffes></color>"
      - "<!i><color:#9ca3af>Maintenir clic droit pour fumer,</color>"
      - "<!i><color:#9ca3af>clic droit sur un ami pour le passer.</color>"
      - "<!i><i><color:#71717a>Roulé serré, comme il faut.</color></i>"
      - "<!i><color:#3f3f46>· · · · · · · · · · · · · · · ·</color>"

