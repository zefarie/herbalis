  pose-place-occupee: "<color:#f87171>Il y a déjà quelque chose ici.</color>"
  plante-arrachee: "<color:#fbbf24>Plante arrachée.</color>"
  pot-casse: "<color:#fbbf24>Pot récupéré.</color>"
  goutte-installee: "<color:#7dd3fc>Goutte-à-goutte installé. L'eau tiendra bien plus longtemps.</color>"
  goutte-deja: "<color:#9ca3af>Ce pot a déjà son goutte-à-goutte.</color>"
  plante-morte-arrachee: "<color:#9ca3af>Tu arraches les restes secs de la plante...</color>"
  pot-vide-info: "<color:#9ca3af>Ce pot est vide.</color>"
  plante-morte-info: "<color:#f87171>Cette plante est morte.</color>"

arrosage:
  arrosee: "<color:#7dd3fc><font:herbalis:icons></font> La terre boit à grandes gorgées.</color>"
  deja-humide: "<color:#9ca3af>La terre est déjà bien humide.</color>"
  deja-plein: "<color:#9ca3af>L'arrosoir est déjà plein.</color>"
  rempli: "<color:#7dd3fc><font:herbalis:icons></font> Arrosoir rempli.</color>"
  arrosoir-vide: "<color:#f87171>Arrosoir vide. Recharge-le sur de l'eau.</color>"

engrais:
  applique: "<color:#a3e635><font:herbalis:icons></font> L'engrais se mêle au terreau.</color>"
  deja-applique: "<color:#9ca3af>Ce stage a déjà reçu son engrais.</color>"

recolte:
  optimale: "<color:#4ade80><font:herbalis:icons></font> <nombre> tête(s) au meilleur moment, +<graines> graine(s) !</color> <etoiles>"
  tardive: "<color:#fbbf24><font:herbalis:icons></font> <nombre> tête(s) un peu tard, +<graines> graine(s)...</color> <etoiles>"

taille:
