# ==============================================================
#  Herbalis : configuration generale
#
#  Toutes les durees acceptent les formats "30s", "8m", "1h30m",
#  "2d" ou "1j12h" (j et d valent un jour), ou un nombre brut
#  en secondes.
#
#  Les parametres propres a chaque drogue (durees de croissance,
#  hydratation, effets, tolerance...) vivent dans drugs/<id>.yml.
# ==============================================================

croissance:
  # Intervalle du tick global de croissance, en secondes.
  # Une seule tache gere toutes les plantes chargees.
  # (redemarrage requis si modifie)
  tick-secondes: 1

persistence:
  # Intervalle de sauvegarde automatique des plantes vers SQLite.
  # Les pots, racks et profils joueurs sont ecrits immediatement.
  # (redemarrage requis si modifie)
  autosave: 5m

effets-visuels:
  # Coupe toutes les particules du plugin.
  particules: true
  # Coupe tous les sons du plugin.
  sons: true
  # Animation continue des plantes : balancement doux et respiration.
  animation-plantes: true
  # Retours d'action dans l'actionbar (pose, casse, recolte, effets...).
  # Desactive par defaut : les particules et les sons suffisent.
  actionbar: false

hud:
  # Action bar d'etat quand on regarde une plante, un pot ou un rack.
  actif: true
  # Portee du regard, en blocs.
  portee: 5.0

arrosoir:
  # Nombre d'arrosages avant de devoir recharger l'arrosoir
  # (clic droit sur un bloc d'eau pour recharger).
  charges: 8

pulverisateur:
  # Nombre de traitements anti-nuisibles avant de devoir recharger
  # le pulverisateur (clic droit sur un bloc d'eau).
  charges: 6

goutte-a-goutte:
  # Multiplicateur de la perte d'hydratation quand un goutte-a-goutte
  # est installe sur le pot (0.5 = l'eau tient deux fois plus
  # longtemps, pratique pour les cultivateurs peu presents).
  facteur-perte: 0.5

irrigation:
  # Un seau verse dans un caisson vaut autant de points d'hydratation.
  # 100 points = un arrosage complet = environ une journee d'eau pour
  # une plante (deux avec un goutte-a-goutte sur le pot).
  eau-par-seau: 100.0
  # Capacite de chaque taille de caisson, en seaux.
  capacite-seaux:
    cuve: 16
    citerne: 64
    reservoir: 256

silo:
  # Doses d'engrais que peut contenir un silo (une dose = un engrais,
  # appliquee automatiquement aux pots relies, une fois par stage).
  capacite-doses: 16

lampe:
  # Niveau de lumiere emis par la lampe horticole UV (1 a 15).
  niveau-lumiere: 15

taille:
  # Points de durabilite perdus par les cisailles (l'outil vanilla)
  # a chaque taille. 0 = aucune usure.
  usure-cisailles: 1

plantes:
  # Une plante cassee (coup, explosion, support detruit) rend sa graine.
  drop-graine-si-cassee: true
  # Les explosions tuent les plantes alentour.
  explosion-detruit: true
  # Rayon (en blocs) dans lequel une explosion tue les plantes.
  rayon-explosion: 4.0

manque:
  # Intervalle aleatoire entre deux symptomes de manque
  # pour un joueur en etat d'addiction.
  symptome-min: 40s
  symptome-max: 90s
