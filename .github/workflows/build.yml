name: build

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Build plugin and resource pack
        run: ./gradlew build packResourcePack

      - name: Upload plugin jar
        uses: actions/upload-artifact@v4
        with:
          name: Herbalis
          path: build/libs/Herbalis-*.jar

      - name: Upload resource pack
        uses: actions/upload-artifact@v4
        with:
          name: Herbalis-ResourcePack
          path: |
            build/resourcepack/Herbalis-ResourcePack.zip
            build/resourcepack/Herbalis-ResourcePack.sha1
